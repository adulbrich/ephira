name: Checks
on:
  # No `branches:` filter. That key filters on the PR's *base*, so a pull
  # request stacked on another feature branch ran none of these checks and
  # still reported green, because the Vercel checks do run. Green meaning
  # "nothing was checked" is worse than red.
  #
  # `edited` is in the list because changing a PR's base fires that event and
  # nothing else; without it, retargeting a PR to fix the above does not
  # produce a run.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least privilege for GITHUB_TOKEN. These jobs only check out the repo and run
# node; nothing here talks to the GitHub API. Without this key the token is
# whatever the repository default happens to be, which is a wider grant than
# anything in this file uses.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set-up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: |
          npm install
      - name: Lint and check formatting
        run: |
          npx biome ci .
      # The rules Biome cannot express; see the header of eslint.config.js.
      - name: Lint the rules Biome cannot express
        run: |
          npx eslint . --max-warnings=0
      - name: Typecheck
        run: |
          npm run typecheck
      - name: Run tests
        run: |
          npm test -- --ci
