name: Checks
on:
  # No `branches:` filter. That key filters on the PR's *base*, so a pull
  # request stacked on another feature branch ran none of these checks and
  # still reported green, because the Vercel checks do run. Green meaning
  # "nothing was checked" is worse than red.
  #
  # `edited` is in the list because changing a PR's base fires that event and
  # nothing else; without it, retargeting a PR to fix the above does not
  # produce a run.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The ruleset's up-to-date requirement means a PR's last run already tested
  # the tree main becomes. This run records that result on main itself, so a
  # red main (a flaky test, a new runner image) shows where everyone looks.
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. These jobs only check out the repo and run
# node; nothing here talks to the GitHub API. Without this key the token is
# whatever the repository default happens to be, which is a wider grant than
# anything in this file uses.
permissions:
  contents: read

jobs:
  checks:
    # The required check on main is this name; renaming the job blocks every
    # PR until the ruleset is updated to match.
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot
      # change what runs here; Dependabot proposes the bumps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-message step walks every commit the PR adds, which
          # needs the base branch reachable.
          fetch-depth: 0
      - name: Set-up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` installs the lockfile exactly and fails if it disagrees with
      # package.json; `npm install` would quietly rewrite it.
      - name: Install Dependencies
        run: |
          npm ci
      - name: No emdash or emoji in tracked text
        run: |
          npm run check:prose
      # The script lefthook runs at commit-msg, over the commits a
      # `--no-verify` could have let through. Dependabot is skipped: its
      # bodies embed upstream release notes. Keyed on who opened the PR, not
      # `github.actor`, which changes when a maintainer pushes a fix-up.
      - name: Commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/check-commit-message.mjs --range "origin/$BASE_REF..HEAD"
      - name: Lint and check formatting
        run: |
          npx biome ci .
      # The rules Biome cannot express; see the header of eslint.config.js.
      - name: Lint the rules Biome cannot express
        run: |
          npx eslint . --max-warnings=0
      - name: Typecheck
        run: |
          npm run typecheck
      - name: Run tests
        run: |
          npm test -- --ci
