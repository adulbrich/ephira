name: Checks
on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set-up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: |
          npm install
      - name: Run ESLint
        run: |
          npx eslint . --max-warnings=0
      - name: Typecheck
        run: |
          npm run typecheck
      - name: Run tests
        run: |
          npm test -- --ci
