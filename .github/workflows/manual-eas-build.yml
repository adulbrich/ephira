name: Manual Expo EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build?"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - android
          - ios

# Least privilege for GITHUB_TOKEN. This workflow authenticates to EAS with
# EXPO_TOKEN and never calls the GitHub API: expo-github-action is only given
# an Expo token here, and the build runs on EAS rather than in this job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          if [[ "${{ github.event.inputs.platform }}" == "android" ]]; then
            echo "Building Android only..."
            eas build --platform android --non-interactive --profile production
          elif [[ "${{ github.event.inputs.platform }}" == "ios" ]]; then
            echo "Building iOS only..."
            eas build --platform ios --non-interactive --profile production
          else
            echo "Building both Android and iOS..."
            eas build --platform android --non-interactive --profile production
            eas build --platform ios --non-interactive --profile production
          fi
